<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DeskCat 小工具腳本</title>
<!-- iPhone 用：一鍵複製 Scriptable 小工具腳本（2026-10-16 使用者：「iPhone 好像按不了全選」）。
     打開 http://<電腦 IP>:8770/widget/（mobile/tools/serve.py）。不要從對話框、聊天軟體複製腳本（mobile/widget/小工具規範.md 第 2 節）。
     家裡 Wi-Fi 是 http：瀏覽器不給 navigator.clipboard → 用「選起來＋execCommand('copy')」；再不行就在下面的框裡長按 → 全選 → 拷貝。 -->
<style>
  :root { --bg: #fffaf2; --ink: #3b2f28; --muted: #8a7a6c; --line: #eadfce; --main: #e07b39; --ok: #2f8a4c; --bad: #c0392b; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #221d1a; --ink: #f1e6d8; --muted: #b3a493; --line: #3a312a; --main: #e8894a; --ok: #5cc27e; --bad: #ff7b6b; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
         padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 6px 0; }
  .note { color: var(--muted); font-size: 13px; }
  button { width: 100%; min-height: 52px; border: 0; border-radius: 14px; background: var(--main); color: #fff; font: 700 17px/1 inherit; margin: 12px 0 6px; cursor: pointer; }
  button:active { filter: brightness(.85); }
  button:disabled { opacity: .5; }
  #msg { min-height: 1.6em; font-weight: 700; }
  #msg.ok { color: var(--ok); } #msg.bad { color: var(--bad); }
  ol { padding-left: 20px; margin: 8px 0; }
  textarea { width: 100%; box-sizing: border-box; height: 160px; margin-top: 8px; border: 1px solid var(--line); border-radius: 10px;
             background: transparent; color: var(--ink); font: 11px/1.4 ui-monospace, Menlo, monospace; padding: 8px; }
</style>
</head>
<body>
  <h1>DeskCat 小工具腳本</h1>
  <p class="note" id="info">讀取中…</p>
  <button id="copy" disabled>複製整份腳本</button>
  <p id="msg" role="status" aria-live="polite"></p>
  <ol>
    <li>按上面的〔複製整份腳本〕</li>
    <li>打開 Scriptable → 點舊的 DeskCat 腳本（第一次用：右上 ＋ 新增）→ 刪掉全部內容 → 貼上</li>
    <li>第一次用才要：按這個腳本 → 貼上電腦版〔複製設定〕那段 →〔存起來〕</li>
  </ol>
  <p class="note">按鈕不能用的話：在下面的框裡長按 → 全選 → 拷貝。</p>
  <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="小工具腳本全文"></textarea>
<script>
(() => {
  const FILE = 'DeskCat%E5%B0%8F%E5%B7%A5%E5%85%B7.js';
  const $ = id => document.getElementById(id);
  let text = '';
  const say = (t, cls) => { $('msg').textContent = t; $('msg').className = cls || ''; };
  fetch(FILE + '?t=' + Date.now(), { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(t => {
    text = t;
    $('src').value = t;
    const lines = t.split('\n').length;
    $('info').textContent = `共 ${lines} 行（${(new Blob([t]).size / 1024).toFixed(1)} KB）`;
    $('copy').disabled = false;
  }).catch(e => { $('info').textContent = '讀不到腳本：電腦的「手機網頁預覽」要開著（' + e.message + '）'; });

  // http 沒有 navigator.clipboard：用一個看不見的框選起來再複製（跟 clipboard.js 一樣的做法）
  //   readonly＝不跳鍵盤；字 12pt＝iPhone 不會自動放大畫面；iOS 要 setSelectionRange 才選得到全部
  function legacyCopy() {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:-9999px;font-size:12pt;border:0;padding:0;margin:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
    ta.remove();
    window.getSelection && window.getSelection().removeAllRanges();
    return ok;
  }
  $('copy').onclick = async () => {
    if (!text) return;
    let ok = false;
    if (navigator.clipboard && window.isSecureContext && !/[?&]legacy=1/.test(location.search)) {   // ?legacy=1＝測 http 的做法
      try { await navigator.clipboard.writeText(text); ok = true; } catch (_) { ok = false; }
    }
    if (!ok) ok = legacyCopy();
    if (ok) say(`複製好了（${text.split('\n').length} 行）：到 Scriptable 貼上`, 'ok');
    else say('沒複製到：在下面的框裡長按 → 全選 → 拷貝', 'bad');
  };
})();
</script>
</body>
</html>
